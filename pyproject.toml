[project]
name = "nlv"
version = "0.1.0"
description = "Deterministic codebase reading order tool"
requires-python = ">=3.11"
dependencies = [
    "pathspec>=0.12",
    "tree-sitter>=0.24",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/parser/src/nlv"]

[project.scripts]
nlv = "nlv.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyright>=1.1",
    "ruff>=0.4",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["packages"]

[tool.pyright]
pythonVersion = "3.11"
include = ["packages/parser/src"]
extraPaths = ["packages/parser/src"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"

[tool.ruff]
src = ["packages/parser/src"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "T201"]
